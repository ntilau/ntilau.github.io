<!doctype html>
<html lang="en-IN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Shopping cart — Isoko</title>
		<meta
			name="description"
			content="Review your Isoko guest cart, update quantities, and place a local demo order with no payment."
		/>
		<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="style/isoko.css" />
	</head>
	<body data-page="cart">
		<a class="skip-link" href="#main-content">Skip to content</a>
		<header id="site-header"></header>

		<main id="main-content">
			<div class="page-shell">
				<div class="container" id="cart-root"></div>
			</div>

			<noscript>
				<div class="container">
					<div class="empty-state">
						<h1>Your cart needs JavaScript</h1>
						<p>The cart is stored in this browser, so it needs JavaScript to read and update it.</p>
						<a class="btn btn--primary" href="shop.html">Back to the shop</a>
					</div>
				</div>
			</noscript>
		</main>

		<footer id="site-footer"></footer>
		<div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
		<script type="module" src="script/cart.js"></script>
	</body>
</html>
