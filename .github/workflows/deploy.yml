name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Ubuni/frontend/package-lock.json

      - name: Build Ubuni (SvelteKit) for /Ubuni/
        working-directory: Ubuni/frontend
        run: |
          npm ci
          npm run build
        env:
          # kit.paths.base is derived from PAGES_BASE_PATH (svelte.config.js),
          # so the SvelteKit app is built to be served from /Ubuni/
          PAGES_BASE_PATH: /Ubuni

      - name: Assemble site (landing / Runinga / Isoko / Ubuni)
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp -r Runinga site/Runinga
          cp -r Isoko site/Isoko
          cp -r Ubuni/frontend/build site/Ubuni

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
